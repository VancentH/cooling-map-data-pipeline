name: Cooling Data Fetch

on:
  # Manually triggered from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run fetch script
        run: bash scripts/fetch.sh

      - name: Deploy to data-release branch
        run: |
          cd data
          git init
          git checkout -b data-release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sachsen-cooling.geojson
          git commit -m "data: update sachsen-cooling.geojson ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin data-release

